services:
  livekit-server:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/tcp 2>/dev/null | grep -q 18BD"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: advisor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: /app/.venv/bin/uvicorn advisor.api.app:app --host 0.0.0.0 --port 8000
    environment:
      LIVEKIT_URL: ws://livekit-server:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: this-is-a-minimum-32-char-development-secret!!
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      LLM_PROVIDER: groq
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/advisor
    volumes:
      - ./backend/src:/app/src
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent:
    build:
      context: ./backend
    restart: unless-stopped
    command: /app/.venv/bin/python -m advisor.agent.main
    environment:
      LIVEKIT_URL: ws://livekit-server:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: this-is-a-minimum-32-char-development-secret!!
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      LLM_PROVIDER: groq
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TTS_PROVIDER: edge-tts
      STT_PROVIDER: faster-whisper
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/advisor
    volumes:
      - ./backend/src:/app/src
      - ./backend/data:/app/data
    depends_on:
      livekit-server:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  redis_data:
  qdrant_data:
  postgres_data:
